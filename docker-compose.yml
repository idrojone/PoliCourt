  springboot:
    build:
      context: ./backend/policourt-backend
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    env_file:
      - ./backend/policourt-backend/.env.production
    depends_on:
      db:
        condition: service_healthy


  fastapi:
    build:
      context: ./backend/fastapi
      dockerfile: Dockerfile
    ports:
      - "4003:4003"
    env_file:
      - ./backend/fastapi/.env.production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    env_file:
      - ./frontend/.env.production
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - fastapi
      - springboot

  nest-api-gateway:
    build:
      context: ./backend/nest
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
        APP_MAIN_PATH: dist/apps/nest/main.js
    env_file:
      - ./backend/nest/apps/api-gateway/.env.production
    ports:
      - "4002:4002"
    volumes:
      - ./backend/nest/uploads:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy

  nest-notifications:
    build:
      context: ./backend/nest
      dockerfile: Dockerfile
      args:
        APP_NAME: notifications
        APP_MAIN_PATH: dist/apps/notifications/main.js
    env_file:
      - ./backend/nest/apps/notifications/.env.production
    depends_on:
      rabbitmq:
        condition: service_healthy

  request-monitor:
    build:
      context: ./backend/nest
      dockerfile: Dockerfile
      args:
        APP_NAME: request-monitor
        APP_MAIN_PATH: dist/apps/request-monitor/main.js
    env_file:
      - ./backend/nest/apps/request-monitor/.env.production
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      springboot:
        condition: service_started

  stripe:
    image: stripe/stripe-cli:latest
    stdin_open: true
    tty: true
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY:-}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c"]
    command: ["/scripts/stripe-listen.sh"]

volumes:
  test_db_data:
  mongo_data:
  rabbitmq_data:
  ollama_data:
